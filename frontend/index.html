<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduAlert — Hệ thống cảnh báo sớm kết quả học tập đa cấp độ</title>
<style>
  :root {
    --paper: #F8FAFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --ink-soft: #334155;
    --ink-muted: #64748B;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;
    --stamp-blue: #1E3A8A;
    --stamp-blue-soft: #EFF6FF;
    --ok: #166534;
    --ok-bg: #F0FDF4;
    --ok-border: #BBF7D0;
    --mid: #854D0E;
    --mid-bg: #FEFCE8;
    --mid-border: #FEF08A;
    --warn: #991B1B;
    --warn-bg: #FEF2F2;
    --warn-border: #FECACA;
    --serif: "Charter", "Bitstream Charter", Cambria, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html { font-size: 15.5px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--stamp-blue); text-decoration: none; }

  /* Academic Header */
  header.app {
    background: var(--ink);
    color: #F8FAFC;
    padding: 14px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 2px solid #334155;
  }
  header.app .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header.app h1 {
    font-family: var(--serif);
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: .02em;
    font-weight: 700;
  }
  header.app .sub { font-size: .84rem; color: #94A3B8; }
  header.app .rolebar { display: flex; align-items: center; gap: 10px; font-size: .83rem; }
  header.app select.rolesel {
    background: #1E293B;
    color: #F8FAFC;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    font-size: .83rem;
  }
  .btn-export {
    background: var(--ok);
    color: #FFFFFF;
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .btn-export:hover { background: #14532D; }

  /* Hybrid Engine Notice Banner */
  .notice {
    background: #FEF9C3;
    border-bottom: 1px solid #FDE047;
    color: #713F12;
    font-size: .82rem;
    padding: 8px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .notice strong { color: #581C87; }
  .notice .active-badge {
    font-weight: 700;
    color: var(--stamp-blue);
    background: rgba(30, 58, 138, 0.08);
    padding: 3px 9px;
    border-radius: 4px;
  }

  /* Navigation Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0 22px;
    overflow-x: auto;
  }
  .tabs button {
    appearance: none;
    border: 0;
    background: none;
    font: inherit;
    font-size: .86rem;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] {
    color: var(--stamp-blue);
    border-bottom-color: var(--stamp-blue);
  }

  /* Main Container Layout */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 22px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: minmax(360px, 470px) 1fr;
    gap: 22px;
  }
  .grid-equal {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  @media (max-width: 960px) {
    .grid2, .grid-equal { grid-template-columns: 1fr; }
  }

  /* Cards & Forms */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  }
  .card h2 {
    font-family: var(--serif);
    font-size: 1.15rem;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .card p.hint {
    margin: 0 0 14px;
    font-size: .82rem;
    color: var(--ink-muted);
  }
  label {
    display: block;
    font-size: .82rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
    font-weight: 600;
  }
  input, select, textarea {
    font: inherit;
    font-size: .85rem;
    padding: 7px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #FFFFFF;
    color: var(--ink);
    width: 100%;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--stamp-blue);
    box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.12);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 10px; }

  /* Buttons */
  button.primary {
    font: inherit;
    font-weight: 700;
    background: var(--stamp-blue);
    color: #FFFFFF;
    border: 0;
    border-radius: 7px;
    padding: 9px 18px;
    cursor: pointer;
    font-size: .88rem;
    transition: background .15s ease;
  }
  button.primary:hover { background: #172554; }
  button.small {
    font: inherit;
    font-size: .78rem;
    padding: 5px 11px;
    border: 1px solid var(--line-strong);
    background: #F8FAFC;
    color: var(--ink-soft);
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s ease;
  }
  button.small:hover {
    border-color: var(--stamp-blue);
    color: var(--stamp-blue);
    background: #FFFFFF;
  }

  /* KPI Cards */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .pill {
    border-radius: 10px;
    padding: 14px 18px;
    font-size: .82rem;
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.02);
  }
  .pill span { display: block; color: var(--ink-soft); font-weight: 500; }
  .pill b {
    display: block;
    font-size: 1.55rem;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .pill .sub-hint { font-size: .74rem; color: var(--ink-muted); margin-top: 3px; }

  /* Gateway Telemetry Banner */
  .gateway-telemetry-banner {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    background: #F1F5F9;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: .8rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .gateway-telemetry-banner .gw-item { display: flex; align-items: center; gap: 7px; }
  .gw-dot.green {
    width: 8px;
    height: 8px;
    background: #16A34A;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px #16A34A;
  }

  /* Signature Academic Slip (M03) */
  .slip {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
  }
  .slip .slip-head {
    font-family: var(--serif);
    text-align: center;
    border-bottom: 1px dashed var(--line-strong);
    padding: 16px 20px 12px;
    background: #F8FAFC;
  }
  .slip .slip-head .org {
    font-size: .72rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .slip .slip-head h3 {
    margin: 4px 0 2px;
    font-size: 1.25rem;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .slip .slip-head .meta {
    font-family: var(--sans);
    font-size: .82rem;
    color: var(--ink-soft);
  }
  .slip .slip-head .meta-sub {
    font-family: var(--sans);
    font-size: .78rem;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .slip-body {
    display: grid;
    grid-template-columns: 215px 1fr;
    gap: 20px;
    padding: 20px;
  }
  @media (max-width: 720px) {
    .slip-body { grid-template-columns: 1fr; }
  }

  /* Registrar Seal */
  .seal-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .stamp {
    width: 175px;
    height: 175px;
    border-radius: 50%;
    margin: 6px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 3.5px double currentColor;
    transform: rotate(-5.5deg);
    text-align: center;
    padding: 12px;
    font-family: var(--serif);
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    user-select: none;
  }
  .seal-top-text { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .stamp .lv {
    font-size: 1.02rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    line-height: 1.2;
    margin: 2px 0;
  }
  .stamp .pv {
    font-size: 1.85rem;
    font-weight: 700;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    margin: 1px 0;
  }
  .stamp .pl { font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .seal-code { font-family: var(--mono); font-size: .65rem; color: var(--ink-muted); margin-top: 2px; }
  .lv-ok { color: var(--ok); }
  .lv-mid { color: var(--mid); }
  .lv-bad { color: var(--warn); }

  .gpa-forecast-box {
    margin-top: 14px;
    font-size: .8rem;
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    width: 100%;
  }
  .gpa-forecast-box .fc-label { display: block; color: var(--ink-muted); font-size: .74rem; }
  .gpa-forecast-box .fc-value { font-family: var(--mono); font-size: .92rem; color: var(--ink); }

  /* Rules Box & Explanations */
  .rulebox {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 14px;
    margin-bottom: 12px;
    font-size: .83rem;
  }
  .rulebox.trig { background: var(--warn-bg); border-color: var(--warn-border); }
  .rulebox.clear { background: var(--ok-bg); border-color: var(--ok-border); }
  .rulebox h4 { margin: 0 0 6px; font-size: .86rem; color: var(--ink); }
  .rulebox ul { margin: 0; padding-left: 18px; }
  .rulebox li { margin: 3px 0; }
  .rulebox li.hit { color: var(--warn); font-weight: 600; }

  .expl {
    font-size: .84rem;
    background: var(--stamp-blue-soft);
    border: 1px solid #BFDBFE;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
    color: #1E3A8A;
    line-height: 1.5;
  }
  .advisor-hint-box {
    font-size: .82rem;
    background: #FFFBEB;
    border: 1px solid var(--mid-border);
    border-radius: 8px;
    padding: 9px 14px;
    margin-bottom: 14px;
    color: var(--mid);
  }

  /* Diverging SHAP Bar Chart (Symmetric 50% midpoint) */
  .shap-block {
    margin-top: 12px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .shap-header {
    display: flex;
    justify-content: space-between;
    font-size: .78rem;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .shap-title { font-weight: 600; color: var(--ink-soft); }
  .fbar {
    display: grid;
    grid-template-columns: 220px 1fr 60px;
    align-items: center;
    gap: 10px;
    font-size: .79rem;
    margin: 5px 0;
  }
  .fbar-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fbar .track {
    position: relative;
    height: 14px;
    background: #F1F5F9;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #E2E8F0;
  }
  .fbar .track::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #94A3B8;
  }
  .fbar .fill {
    position: absolute;
    top: 2px;
    bottom: 2px;
    border-radius: 4px;
  }
  .fbar .fill.pos { background: #DC2626; }
  .fbar .fill.neg { background: #16A34A; }
  .fbar .val {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: .78rem;
  }
  .val-bad { color: #DC2626; }
  .val-ok { color: #16A34A; }

  /* Tables */
  table.data {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    font-size: .83rem;
  }
  table.data th {
    background: #F1F5F9;
    text-align: left;
    padding: 9px 12px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  table.data td {
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  table.data tr:hover td { background: #F8FAFC; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 99px;
    font-size: .73rem;
    font-weight: 700;
    font-family: var(--mono);
  }
  .b-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
  .b-mid { background: var(--mid-bg); color: var(--mid); border: 1px solid var(--mid-border); }
  .b-bad { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }

  /* Trajectory Chart SVG */
  .svg-chart-wrapper {
    background: #F8FAFC;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    margin-top: 6px;
  }
  .trajectory-svg { width: 100%; height: auto; display: block; }
  .chart-label { font-size: 10px; fill: #64748B; font-family: var(--sans); }
  .chart-label-warn { font-size: 9.5px; fill: #EF4444; font-weight: 600; font-family: var(--sans); }
  .chart-value { font-size: 10px; fill: #1E3A8A; font-family: var(--mono); font-weight: 600; }
  .chart-value-bold { font-size: 10.5px; fill: #EF4444; font-family: var(--mono); font-weight: 700; }

  /* Quick Picker & What-If Panel */
  .picker-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }
  .picker-left { flex: 1; min-width: 280px; }
  .picker-inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .toggle-sim-btn { font-weight: 600; }
  .sim-panel {
    background: #F8FAFC;
    border: 1px solid var(--stamp-blue);
    border-left: 5px solid var(--stamp-blue);
  }
  .sim-expl {
    font-size: .8rem;
    color: var(--ink-soft);
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    line-height: 1.5;
  }
  .sim-expl ul { margin: 6px 0 0; padding-left: 18px; }

  /* Cohort Filter Bar */
  .filter-bar {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .filter-item { min-width: 170px; }
  .filter-count { font-size: .82rem; color: var(--ink-muted); align-self: center; }
  .pagination-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px 2px;
    font-size: .82rem;
  }

  /* Graph Network Visualizer */
  .graph-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }
  .svg-graph-box {
    background: #FAFBFD;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .network-svg { width: 100%; height: auto; display: block; }
  .node-label { font-size: 8px; font-family: var(--mono); font-weight: 600; pointer-events: none; }
  .node-detail { font-size: .84rem; }
  .node-badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .node-id-large { font-family: var(--mono); font-size: 1.4rem; font-weight: 700; color: var(--ink); }

  /* Interventions & CSV Upload */
  .import-result {
    margin-top: 12px;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: .83rem;
  }
  .res-ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: var(--ok); }
  .res-err { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn); }
  .import-result h4 { margin: 0 0 6px; }
  .import-result ul { margin: 4px 0 0; padding-left: 18px; }

  /* Copilot Chat UI */
  .copilot-container { max-width: 880px; margin: 0 auto; }
  .copilot-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip-btn {
    font-size: .78rem;
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    color: var(--stamp-blue);
    border-radius: 99px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip-btn:hover { background: #DBEAFE; }
  .chat-window {
    background: #F8FAFC;
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 280px;
    max-height: 440px;
    overflow-y: auto;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .84rem;
    line-height: 1.5;
  }
  .chat-bubble.bot {
    background: #FFFFFF;
    border: 1px solid var(--line);
    align-self: flex-start;
    color: var(--ink);
  }
  .chat-bubble.user {
    background: var(--stamp-blue);
    color: #FFFFFF;
    align-self: flex-end;
  }
  .chat-citation {
    margin-top: 6px;
    font-size: .74rem;
    color: #1D4ED8;
    background: #EFF6FF;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .chat-sql {
    margin-top: 6px;
    background: #0F172A;
    color: #38BDF8;
    padding: 6px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: .74rem;
    overflow-x: auto;
  }
  .chat-input-row { display: flex; gap: 10px; }

  /* Hexagonal Diagram Representation */
  .hex-diagram-box {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 16px;
    margin: 14px 0;
  }
  @media (max-width: 860px) {
    .hex-diagram-box { grid-template-columns: 1fr; }
  }
  .hex-column {
    background: #F8FAFC;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }
  .hex-column h3 {
    margin: 0 0 10px;
    font-size: .9rem;
    font-family: var(--serif);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
  }
  .hex-card {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px;
    margin-bottom: 8px;
    font-size: .8rem;
    color: var(--ink-soft);
  }
  .hex-card.core-card {
    border-left: 4px solid var(--stamp-blue);
    background: #F0F7FF;
  }
  .hex-card.core-card p { margin: 4px 0 0; font-size: .75rem; color: var(--ink-muted); }

  /* Footer */
  footer {
    color: var(--ink-muted);
    font-size: .78rem;
    padding: 20px 26px;
    max-width: 1280px;
    margin: 0 auto;
    border-top: 1px solid var(--line);
  }
