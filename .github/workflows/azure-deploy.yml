name: EduAlert Automated CI Test Suite (Python & BFF)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & run 9/9 Python unit tests
        run: |
          pip install -r requirements.txt
          python tests/test_edualert.py

      - name: Run 5/5 Node.js BFF & Circuit Breaker unit tests
        run: |
          node tests/test_gateway.js
